<!-- The plugin UI. Figma loads exactly one HTML file, so CSS and JS are inline. -->
<style>
  :root {
    color-scheme: light dark;
    --bg: var(--figma-color-bg, #fff);
    --fg: var(--figma-color-text, #1e1e1e);
    --fg-dim: var(--figma-color-text-secondary, #6b6b6b);
    --border: var(--figma-color-border, #e5e5e5);
    --surface: var(--figma-color-bg-secondary, #f5f5f5);
    --accent: var(--figma-color-bg-brand, #0d99ff);
    --accent-fg: var(--figma-color-text-onbrand, #fff);
    --ok: #14ae5c;
    --warn: #f0a92e;
    --err: #f24822;
    --idle: #9b9b9b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 11px/1.45 "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--fg);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
  }
  .pad { padding: 12px 14px; }
  .row { display: flex; align-items: center; gap: 8px; }
  .between { justify-content: space-between; }
  .divider { border-top: 1px solid var(--border); }
  h2 { font-size: 11px; font-weight: 600; margin: 0; letter-spacing: .01em; }
  .dim { color: var(--fg-dim); }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; }

  /* Status lights */
  .status { display: flex; flex-direction: column; gap: 5px; }
  .light { width: 7px; height: 7px; border-radius: 50%; background: var(--idle); flex: none; }
  .light.ok { background: var(--ok); }
  .light.warn { background: var(--warn); }
  .light.err { background: var(--err); }
  .light.busy { background: var(--accent); animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }

  /* Selection card */
  .card {
    background: var(--surface);
    border-radius: 6px;
    padding: 10px 11px;
  }
  .title { font-weight: 600; font-size: 12px; }
  .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* Buttons */
  button {
    font: inherit; font-weight: 500;
    border-radius: 6px; border: 1px solid transparent;
    padding: 7px 12px; cursor: pointer;
    background: var(--surface); color: var(--fg);
    border-color: var(--border);
  }
  button:hover:not(:disabled) { filter: brightness(.97); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--accent); color: var(--accent-fg); border-color: transparent; }
  button.wide { width: 100%; padding: 9px 12px; font-size: 12px; }
  button.link {
    background: none; border: none; padding: 2px 0;
    color: var(--fg-dim); text-decoration: underline; font-size: 10px;
  }

  /* Switch */
  .switch { position: relative; width: 28px; height: 16px; flex: none; }
  .switch input { opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
  .track {
    position: absolute; inset: 0; border-radius: 8px;
    background: var(--border); transition: background .15s; pointer-events: none;
  }
  .thumb {
    position: absolute; top: 2px; left: 2px; width: 12px; height: 12px;
    border-radius: 50%; background: #fff; transition: transform .15s; pointer-events: none;
    box-shadow: 0 1px 2px rgba(0,0,0,.25);
  }
  .switch input:checked ~ .track { background: var(--ok); }
  .switch input:checked ~ .thumb { transform: translateX(12px); }

  /* Options */
  select {
    font: inherit; padding: 4px 6px; border-radius: 5px;
    border: 1px solid var(--border); background: var(--bg); color: var(--fg);
  }
  label.opt { display: flex; align-items: center; gap: 7px; cursor: pointer; }

  /* Log */
  .log { max-height: 140px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
  .entry { display: flex; gap: 6px; align-items: flex-start; font-size: 10px; line-height: 1.4; }
  .glyph { flex: none; width: 10px; text-align: center; font-weight: 700; }
  .glyph.ok { color: var(--ok); }
  .glyph.warn { color: var(--warn); }
  .glyph.err { color: var(--err); }

  /* Progress */
  .bar { height: 2px; background: var(--border); border-radius: 1px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .12s; }

  input.code {
    font: inherit; font-family: ui-monospace, monospace; letter-spacing: .18em;
    text-align: center; text-transform: uppercase;
    padding: 7px; width: 100%; border-radius: 6px;
    border: 1px solid var(--border); background: var(--bg); color: var(--fg);
  }
  [hidden] { display: none !important; }
  .footnote { font-size: 9.5px; color: var(--fg-dim); }
</style>

<div id="app"></div>
