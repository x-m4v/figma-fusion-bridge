name: Check and build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: python -m pip install -r requirements-dev.txt -r requirements-build.txt
      - run: python -m pytest resolve/tests bridge-python/tests -q
      - run: ./scripts/build-windows.ps1
      - name: Check packaged installation and CLI with Unicode and spaces
        shell: pwsh
        run: |
          $env:FFBRIDGE_SUPPORT_DIR = Join-Path $env:RUNNER_TEMP 'Bridge данные с пробелами'
          $env:FFBRIDGE_SCRIPTS_DIR = Join-Path $env:RUNNER_TEMP 'Resolve scripts'
          & dist/windows/FigmaFusionBridge/FigmaFusionBridge.exe --install
          if ($LASTEXITCODE -ne 0) { throw 'Packaged installation failed' }
          & dist/windows/FigmaFusionBridge/FigmaFusionBridge.exe --cli --help
          if ($LASTEXITCODE -ne 0) { throw 'Packaged CLI failed' }
          & python scripts/test-windows-package.py
          if ($LASTEXITCODE -ne 0) { throw 'Lua packaged CLI failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            dist/figma-fusion-bridge-*-windows-x64.zip
            dist/figma-fusion-bridge-*-windows-x64.zip.sha256
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: python3 -m pip install -r requirements-dev.txt
      - run: python3 -m pytest resolve/tests bridge-python/tests -q
      - run: cd bridge-macos && swift run BridgeTests
      - run: bash scripts/build-app.sh
      - run: python3 scripts/package-release.py macos
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: |
            dist/figma-fusion-bridge-*-macos-arm64.zip
            dist/figma-fusion-bridge-*-macos-arm64.zip.sha256
